<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Mental Health Support Gibraltar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            beige: '#FAF9F6',
                            purple: '#6D28D9',
                            orange: '#EA580C'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 font-sans min-h-screen">

    <!-- Login screen -->
    <div id="login-screen" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white dark:bg-gray-800 p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-100 dark:border-gray-700">
            <h2 class="text-3xl font-bold text-center mb-6 text-brand-purple">Admin Login</h2>
            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Password</label>
                    <input type="password" id="password" class="w-full px-4 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600 focus:outline-none focus:ring-2 focus:ring-brand-purple" required>
                </div>
                <div id="loginError" class="text-red-500 text-sm hidden">Incorrect password.</div>
                <button type="submit" class="w-full bg-brand-purple text-white font-bold py-2 px-4 rounded-lg hover:bg-purple-800 transition">Login</button>
            </form>
            <div class="mt-4 text-center">
                <a href="index.html" class="text-sm text-gray-500 hover:underline">← Back to website</a>
            </div>
        </div>
    </div>

    <!-- Admin Dashboard -->
    <div id="admin-dashboard" class="hidden">
        <nav class="bg-white dark:bg-gray-800 shadow-sm py-4 px-6 md:px-12 flex justify-between items-center border-b dark:border-gray-700">
            <div class="font-bold text-xl text-brand-purple">MindHelpGI Admin</div>
            <div class="flex gap-4">
                <a href="index.html" class="text-gray-600 dark:text-gray-300 hover:text-brand-orange">View Site</a>
                <button onclick="logout()" class="text-red-500 font-medium hover:text-red-700">Logout</button>
            </div>
        </nav>

        <main class="container mx-auto px-6 py-8 flex flex-col md:flex-row gap-8">
            <!-- Form -->
            <div class="w-full md:w-1/3 bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-sm border dark:border-gray-700 h-max">
                <h3 class="text-xl font-bold mb-4" id="formTitle">Add New Organization</h3>
                <form id="orgForm" class="space-y-4">
                    <input type="hidden" id="orgId">
                    <div>
                        <label class="block text-sm font-medium mb-1">Name *</label>
                        <input type="text" id="orgName" required class="w-full px-3 py-2 border rounded-md dark:bg-gray-700 dark:border-gray-600">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Category *</label>
                        <select id="orgCategory" required class="w-full px-3 py-2 border rounded-md dark:bg-gray-700 dark:border-gray-600">
                            <option value="Crisis">Crisis</option>
                            <option value="Youth">Youth</option>
                            <option value="General Support">General Support</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Description *</label>
                        <textarea id="orgDesc" required rows="3" class="w-full px-3 py-2 border rounded-md dark:bg-gray-700 dark:border-gray-600"></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Website URL</label>
                        <input type="url" id="orgWeb" class="w-full px-3 py-2 border rounded-md dark:bg-gray-700 dark:border-gray-600">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">WhatsApp Link (api.whatsapp.com/...)</label>
                        <input type="url" id="orgWa" class="w-full px-3 py-2 border rounded-md dark:bg-gray-700 dark:border-gray-600">
                    </div>
                    <div class="flex gap-2 pt-2">
                        <button type="submit" class="flex-1 bg-brand-purple text-white font-bold py-2 rounded-md hover:bg-purple-800">Save</button>
                        <button type="button" onclick="resetForm()" class="flex-1 bg-gray-200 dark:bg-gray-600 text-gray-800 dark:text-white font-bold py-2 rounded-md">Cancel</button>
                    </div>
                </form>
            </div>

            <!-- List -->
            <div class="w-full md:w-2/3">
                <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border dark:border-gray-700 overflow-hidden">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-100 dark:bg-gray-900 border-b dark:border-gray-700">
                                <th class="p-4 font-semibold">Name</th>
                                <th class="p-4 font-semibold">Category</th>
                                <th class="p-4 font-semibold text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="adminList" class="divide-y dark:divide-gray-700">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="admin.js"></script>
    <script src="app.js"></script> <!-- To reuse data functions -->
</body>
</html>
